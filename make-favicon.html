<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENJAMI Favicon Creator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #F0EDFF;
            color: #172554;
            max-width: 650px;
            margin: 60px auto;
            padding: 24px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #CBD5E1;
            border-radius: 12px;
            margin: 12px 0;
        }

        button {
            background: #3156A6;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #message {
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <h1>ENJAMI 💙</h1>
    <h2>Favicon Creator</h2>
    <p>Paste your complete image data below. It should begin with
       data:image/webp;base64,</p>

    <textarea id="imageData"
        placeholder="Paste the complete image data here..."></textarea>

    <button onclick="downloadFavicon()">Download Favicon</button>

    <p id="message"></p>

    <script>
        function downloadFavicon() {
            const input = document.getElementById("imageData").value.trim();
            const message = document.getElementById("message");

            try {
                const match = input.match(
                    /^data:image\/webp;base64,([A-Za-z0-9+/=\s]+)$/
                );

                if (!match) {
                    throw new Error("Please paste the complete WebP image data.");
                }

                const binary = atob(match[1].replace(/\s/g, ""));
                const bytes = new Uint8Array(binary.length);

                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }

                const blob = new Blob([bytes], { type: "image/webp" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = url;
                link.download = "favicon.webp";
                link.click();

                setTimeout(() => URL.revokeObjectURL(url), 1000);
                message.textContent =
                    "Your favicon download should have started! 💙";
            } catch (error) {
                message.textContent = error.message;
            }
        }
    </script>
</body>
</html>
